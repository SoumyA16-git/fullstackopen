name: Part 10 React Native Tests & Lint

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-lint-part10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test & Lint Rate Repository App (Part 10)
        run: |
          npm install --no-package-lock --legacy-peer-deps
          npm run lint
          npm test -- --watchAll=false
        working-directory: part10/rate-repository-app
