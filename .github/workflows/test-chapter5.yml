name: Test Chapter 5 E2E

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-chapter5:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --no-package-lock
        working-directory: part8/library-backend

      - name: Install frontend dependencies
        run: npm install --no-package-lock
        working-directory: part8/library-frontend

      - name: Install test dependencies
        run: npm install --no-package-lock
        working-directory: part8/tests-chapter5

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: part8/tests-chapter5

      - name: Run chapter 5 E2E tests
        run: npm test
        working-directory: part8/tests-chapter5
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: part8/tests-chapter5/playwright-report/
          retention-days: 7
